name: Update GitHub Star Data

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/update_github_stars.py'
      - '.github/workflows/github_stars.yaml'
  schedule:
    # Every Monday at 16:15 China Standard Time (08:15 UTC).
    - cron: '15 8 * * 1'
  workflow_dispatch:

concurrency:
  group: github-star-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch repository stars
        run: python .github/scripts/update_github_stars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/github_stars.json
          if git diff --cached --quiet; then
            echo "GitHub star data is unchanged."
            exit 0
          fi
          git commit -m "Update GitHub star data"
          git push
