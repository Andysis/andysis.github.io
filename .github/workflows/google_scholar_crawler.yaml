name: Get Citation Data

on:
 schedule:
  # Every Monday at 16:00 China Standard Time (08:00 UTC).
  - cron: '0 8 * * 1'
 workflow_dispatch:
 push:
  branches:
   - main
  paths:
   - 'google_scholar_crawler/**'
   - '.github/workflows/google_scholar_crawler.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Reqs
      run: |
        cd ./google_scholar_crawler
        python -m pip install -r requirements.txt
        python -m pip check
        python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"
        python -m unittest -v test_main.py
    - name: Run
      run: |
        cd ./google_scholar_crawler
        python main.py
        cd ./results
        if ! compgen -G "*.json" > /dev/null; then
          echo "No citation JSON files were generated."
          exit 1
        fi
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        PYTHONUNBUFFERED: "1"
        SCHOLAR_DIRECT_TIMEOUT: "20"
        SCHOLAR_FETCH_TIMEOUT: "45"
        SCHOLAR_MAX_ATTEMPTS: "1"
        SCHOLAR_RETRY_BASE_SECONDS: "10"
